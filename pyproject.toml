[tool.poetry]
name = "davision-tech-radar"
version = "0.1.0"
description = "Davision AI Tech & Trend Radar — Autonomous Multi-Agent Intelligence Platform"
authors = ["Davision AI <hello@davision.ai>"]
readme = "README.md"
packages = [{include = "agents"}, {include = "connectors"}, {include = "core"}, {include = "api"}]

[tool.poetry.dependencies]
python = "^3.11"

# Web / Scraping
httpx = {extras = ["http2"], version = "^0.27"}
feedparser = "^6.0"
beautifulsoup4 = "^4.12"
lxml = "^5.2"
playwright = "^1.44"
crawl4ai = "^0.3"

# LLM + Embeddings
openai = "^1.35"
anthropic = "^0.28"
instructor = "^1.3"
tiktoken = "^0.7"

# Vector DB
chromadb = "^0.5"

# Relational DB
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.29"
alembic = "^1.13"

# API
fastapi = "^0.111"
uvicorn = {extras = ["standard"], version = "^0.30"}
python-multipart = "^0.0.9"

# Scheduling
apscheduler = "^3.10"

# Config & Validation
pydantic = "^2.7"
pydantic-settings = "^2.3"
python-dotenv = "^1.0"

# Utilities
tenacity = "^8.3"
structlog = "^24.2"
rich = "^13.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
httpx = "^0.27"
respx = "^0.21"
mypy = "^1.10"
ruff = "^0.4"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
